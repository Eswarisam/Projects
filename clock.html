<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #backround{
            height: 300px;
            background:linear-gradient(to right,#00c6ff,#0072ff);
        }
        #clock{
            font-size: 18vh;
            text-align: center;
            padding-top: 100px;
            color:white;
            font-family:sans-serif;
            
        }
    </style>
</head>
<body id="backround">
    <h2 id="clock"></h2>
    <script >
       function clock(){
        let now =new Date()
        let hours =now.getHours()
        let minutes = now.getMinutes()
        let seconds = now.getSeconds()
        let ampm

        if(hours >= 12){
            ampm = "PM"
        }else{
            ampm ="AM"
        }
        
        if(hours < 10){
            hours="0"+hours
        }else{
            hours = hours
        }
        
        if(minutes < 10){
            minutes ="0"+minutes
        }else{
            minutes = minutes
        }

        if(seconds < 10){
            seconds ="0"+seconds
        }else{
            seconds=seconds
        }

        let time = hours+":"+minutes+":"+seconds+":"+ampm
        document.getElementById("clock").innerText=time
        
       } 
        setInterval(clock,1000)
       
    </script>
</body>
</html>
