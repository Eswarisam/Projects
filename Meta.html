<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        #box{
            height: 350px;
            width: 600px;
            background-color: bisque;
            margin: auto;
            margin-top: 20px; 
        }
        h2{
            text-align: center;
        }
        label{
            margin-left: 50px;
        }
        #nameId{
            margin: 0px 0px 0px 60px;
        }
        #ageId{
    
            margin: 10px 0px 0px 72px;
        }
        #numId{
    
            margin: 10px 0px 10px 5px;
        }
        p{
           font-size: 10px;
           margin-left:  280px;
           color: red;
        }
        #validone{
          display: none;
        }
        #validtwo{
        display: none;
        }
        #validthree{
         display: none;
        }
        h4{
            text-align: center;
        }
        button{
            margin-left: 250px;
            margin-bottom: 50px;
            background-color: blue;
            color: white;
            font-size: 10px;
            padding: 3px 20px 3px 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="box">
        <h2>Validation Form</h2><br><hr><br>
        <label for="">Enter Your Name:</label>
        <input type="text" name="" id="nameId">
        <p id="validone">Invalid name</p><br>
        <label for="">Enter Your Age:</label>
        <input type="text" id="ageId">
        <p id="validtwo">Invalid age</p><br>
        <label for="">Enter Your phone number:</label>
        <input type="text" id="numId">
        <p id="validthree">Invalid number</p><br><hr><br>
        <button id="btn">Submit</button>
        <h4 id="res"></h4>
        <h4 id="result"></h4>
        <h4 id="reslt"></h4>
    </div>
    <script>
        let name = document.getElementById("nameId");
        let validone = document.getElementById("validone");
        let age = document.getElementById("ageId");
        let validtwo = document.getElementById("validtwo");
        let num = document.getElementById("numId");
        let validthree = document.getElementById("validthree");
        let res = document.getElementById("res");
        let result = document.getElementById("result");
        let reslt = document.getElementById("reslt")
        let button = document.getElementById("btn")
        
        button.addEventListener("click",()=>{
            let patone = /^[A-Za-z]{1,15}$/;
            if(patone.test(name.value)){
                name.style.border = " 1.5px solid green"
                res.innerText =`Name : ${name.value}`
            }else{
                name.style.border =" 1.5px solid red"
                validone.style.display = "block"
            }

            let pattwo = /^[0-9]{1,3}$/;
             if(pattwo.test(age.value)){
                age.style.border = " 1.5px solid green"
                result.innerText =`Age :${age.value}`
            }else{
                age.style.border =" 1.5px solid red"
                validtwo.style.display = "block"
            }
            let patthree =/^[0-9]{1,10}$/;
            
            if(patthree.test(num.value)){
                num.style.border = " 1.5px solid green"
                reslt.innerText=`Number :${num.value}`
            }else{
                num.style.border =" 1.5px solid red"
                validthree.style.display = "block"
            }
        });
    </script>
</body>
</html>
